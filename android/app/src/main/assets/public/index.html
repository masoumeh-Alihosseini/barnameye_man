<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F6B">
<title>برنامه‌ی من</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("fonts/Vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#EDF0EB;--surface:#FFFFFF;--ink:#1D2729;--muted:#6B7773;--line:#D8DDD7;
  --accent:#1F6F6B;--accent-ink:#FFFFFF;--accent-soft:#D6E8E5;
  --sun:#D9952B;--sun-soft:#F6E5C3;--danger:#B4473C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131919;--surface:#1D2527;--ink:#E5ECE9;--muted:#93A09B;--line:#2D3638;
    --accent:#5BB5AC;--accent-ink:#0E1515;--accent-soft:#213937;
    --sun:#F0B955;--sun-soft:#3A3122;--danger:#E07A6F;
  }
}
:root[data-theme="dark"]{
  --bg:#131919;--surface:#1D2527;--ink:#E5ECE9;--muted:#93A09B;--line:#2D3638;
  --accent:#5BB5AC;--accent-ink:#0E1515;--accent-soft:#213937;
  --sun:#F0B955;--sun-soft:#3A3122;--danger:#E07A6F;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:10px 0 14px}
.top h1{font-size:1.9rem;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--ink)}

/* week strip: the one bold element */
.week{display:flex;align-items:center;gap:6px;margin:4px 0 22px}
.week .nav{flex:none;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:1.2rem}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dayb{border:none;background:transparent;border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.dayb .wd{font-size:.78rem;color:var(--muted)}
.dayb .dn{font-size:1.35rem;font-weight:700;line-height:1.3}
.dayb .dot{width:5px;height:5px;border-radius:50%;margin-top:3px;background:transparent}
.dayb .dot.on{background:var(--muted)}
.dayb.today .dn{color:var(--sun)}
.dayb.sel{background:var(--ink);color:var(--bg)}
.dayb.sel .wd{color:var(--bg);opacity:.7}
.dayb.sel .dn{color:var(--bg)}
.dayb.sel .dot.on{background:var(--sun)}

/* sections */
h2{font-size:1rem;font-weight:700;margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2 small{font-weight:400;color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-size:.92rem;padding:14px 16px;border:1.5px dashed var(--line);border-radius:14px}
.empty button{background:none;border:none;color:var(--accent);font-weight:700;padding:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:none}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-size:.95rem;padding-top:1px}
.tl .t span{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tl .ti{font-weight:500;overflow-wrap:anywhere}
.tl li.now .t{color:var(--sun)}
.tl li.past .ti{color:var(--muted)}

/* rows */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ti{flex:1;min-width:0;overflow-wrap:anywhere}
.row .meta{display:block;font-size:.78rem;color:var(--muted)}
.row.done .ti{color:var(--muted);text-decoration:line-through}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.star{flex:none;border:none;background:none;font-size:1.15rem;color:var(--line);padding:2px}
.star.on{color:var(--sun)}
.del{flex:none;border:none;background:none;color:var(--muted);font-size:1.25rem;line-height:1;padding:4px 6px;border-radius:8px}
.del:hover{color:var(--danger)}

/* habit chips on day view */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.on::before{content:"✓ ";color:var(--accent);font-weight:700}

/* segmented */
.seg{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:7px 4px;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.quick button,.btn{border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:700}

/* habits */
.habit{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px}
.habit .hd{display:flex;align-items:center;gap:8px}
.habit .hd .ti{flex:1;font-weight:700;overflow-wrap:anywhere}
.streak{font-size:.8rem;color:var(--muted)}
.streak b{color:var(--sun);font-weight:800}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.hday{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:0;font-size:.72rem;color:var(--muted)}
.hday i{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:block}
.hday.on i{background:var(--accent);border-color:var(--accent)}
.hday.today{color:var(--ink);font-weight:700}

/* goals */
.goal{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.goal .hd{display:flex;align-items:flex-start;gap:8px}
.goal .hd .ti{flex:1;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.goal .meta{font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.goal .steps{list-style:none;margin:8px 0 0;padding:0}
.goal .steps li{display:flex;align-items:center;gap:10px;padding:6px 0}
.goal .steps li .ti{flex:1;font-size:.93rem;overflow-wrap:anywhere}
.goal .steps li.done .ti{color:var(--muted);text-decoration:line-through}
.goal .steps .chk{width:20px;height:20px;border-radius:6px}
.goal .steps .chk.on::after{width:5px;height:9px}
.goal .add{display:flex;gap:6px;margin-top:8px}
.goal .add input{flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--line);background:transparent;padding:6px 2px;font-size:.9rem}
.goal .add button{border:none;background:none;color:var(--accent);font-weight:700}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:none;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:6;left:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;border:none;background:var(--sun);color:#1D2729;font-size:1.9rem;line-height:1;
  box-shadow:0 6px 18px -6px rgba(120,80,10,.5)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,15,15,.45);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:90%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h3{margin:0 0 12px;font-size:1.15rem}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.field textarea{min-height:90px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkline{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.95rem}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1;padding:12px}
.actions .ghost{padding:12px 18px;border-radius:12px}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:-4px 0 8px}
</style>
</head>
<body>
<main class="app" id="app"></main>

<button class="fab" id="fab" aria-label="افزودن">+</button>

<nav class="tabs" aria-label="بخش‌ها"><div class="in">
  <button data-tab="day"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>برنامه</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/></svg>کارها</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>عادت‌ها</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>اهداف</button>
</div></nav>

<div class="scrim" id="scrim"><form class="sheet" id="sheet" autocomplete="off"></form></div>

<script>
(function(){
const KEY='planner-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fmt=(d,o)=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d)}catch(e){return d.toLocaleDateString()}};
const greg=(d,o)=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-gregory',o).format(d)}catch(e){return ''}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({tasks:[],events:[],habits:[],goals:[],updatedAt:0});

let state=blank();
try{const raw=localStorage.getItem(KEY);if(raw)state=Object.assign(blank(),JSON.parse(raw))}catch(e){}
const ui={tab:'day',sel:dkey(new Date()),filter:'open',sheetType:'event'};
try{const t=sessionStorage.getItem('planner-tab');if(t)ui.tab=t}catch(e){}

let docRef=null,syncT=null,synced=false;
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  scheduleSync();render();
}
function scheduleSync(){
  if(!docRef)return;
  clearTimeout(syncT);
  syncT=setTimeout(()=>{docRef.set(JSON.parse(JSON.stringify(state))).then(()=>{synced=true;renderSync()}).catch(()=>{synced=false;renderSync()})},700);
}

/* ---------- helpers ---------- */
const todayKey=()=>dkey(new Date());
function streak(h){
  let d=new Date(),n=0;
  if(!h.log[dkey(d)])d=addDays(d,-1);
  while(h.log[dkey(d)]){n++;d=addDays(d,-1)}
  return n;
}
function dateLabel(k){
  if(!k)return '';
  const t=todayKey();
  if(k===t)return 'امروز';
  if(k===dkey(addDays(new Date(),1)))return 'فردا';
  if(k===dkey(addDays(new Date(),-1)))return 'دیروز';
  return fmt(parseKey(k),{weekday:'long',day:'numeric',month:'long'});
}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
const toMin=t=>{if(!t)return -1;const p=t.split(':');return (+p[0])*60+(+p[1])};

/* ---------- views ---------- */
function syncHTML(){return `<div id="sync"></div>`}
function renderSync(){const el=$('#sync');if(el)el.outerHTML=syncHTML()}

function viewDay(){
  const sel=parseKey(ui.sel),tk=todayKey();
  const ws=addDays(sel,-((sel.getDay()+1)%7));
  let strip='';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),k=dkey(d);
    const has=state.events.some(e=>e.date===k)||state.tasks.some(t=>t.date===k&&!t.done);
    strip+=`<button class="dayb${k===ui.sel?' sel':''}${k===tk?' today':''}" data-act="sel" data-k="${k}" aria-pressed="${k===ui.sel}" aria-label="${esc(fmt(d,{weekday:'long',day:'numeric',month:'long'}))}">
      <span class="wd">${fmt(d,{weekday:'narrow'})}</span><span class="dn">${fmt(d,{day:'numeric'})}</span><span class="dot${has?' on':''}"></span></button>`;
  }
  const evs=state.events.filter(e=>e.date===ui.sel).sort((a,b)=>toMin(a.start)-toMin(b.start));
  const nm=nowMin(),isToday=ui.sel===tk,isPast=ui.sel<tk;
  const evHTML=evs.length?`<ul class="tl">${evs.map(e=>{
    const s=toMin(e.start),en=e.end?toMin(e.end):s+60;
    const cls=isPast||(isToday&&en<=nm)?'past':(isToday&&s<=nm&&nm<en?'now':'');
    return `<li class="${cls}"><div class="t">${fa(e.start||'—')}${e.end?`<span>تا ${fa(e.end)}</span>`:''}</div>
      <div class="ti">${esc(e.title)}</div><button class="del" data-act="delEvent" data-id="${e.id}" aria-label="حذف">×</button></li>`}).join('')}</ul>`
    :`<div class="empty">برای این روز چیزی زمان‌بندی نشده. <button data-act="open" data-type="event">افزودن رویداد</button></div>`;

  const tasks=state.tasks.filter(t=>t.date===ui.sel||(isToday&&t.date&&t.date<tk&&!t.done));
  tasks.sort((a,b)=>(a.done-b.done)||((b.star?1:0)-(a.star?1:0)));
  const tHTML=tasks.length?`<ul class="list">${tasks.map(taskRow).join('')}</ul>`
    :`<div class="empty">کاری برای این روز نیست. <button data-act="open" data-type="task">افزودن کار</button></div>`;

  const hHTML=state.habits.length?`<div class="chips">${state.habits.map(h=>`<button class="chip${h.log[ui.sel]?' on':''}" data-act="habit" data-id="${h.id}" data-k="${ui.sel}" aria-pressed="${!!h.log[ui.sel]}">${esc(h.title)}</button>`).join('')}</div>`
    :`<div class="empty">هنوز عادتی ثبت نکرده‌اید. <button data-act="open" data-type="habit">افزودن عادت</button></div>`;

  const doneCount=tasks.filter(t=>t.done).length;
  return `<header class="top"><div>
      <h1>${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</h1>
      <div class="sub">${fmt(sel,{year:'numeric'})} · ${greg(sel,{day:'numeric',month:'long'})}</div>
    </div><div style="text-align:left">${ui.sel!==tk?'<button class="ghost" data-act="today">امروز</button>':''}${syncHTML()}</div></header>
    <div class="week"><button class="nav" data-act="week" data-n="-7" aria-label="هفته‌ی قبل">›</button><div class="days">${strip}</div><button class="nav" data-act="week" data-n="7" aria-label="هفته‌ی بعد">‹</button></div>
    <h2>زمان‌بندی</h2>${evHTML}
    <h2>کارها ${tasks.length?`<small>${fa(doneCount)} از ${fa(tasks.length)}</small>`:''}</h2>${tHTML}
    <h2>عادت‌ها</h2>${hHTML}`;
}

function taskRow(t){
  const meta=t.date&&(ui.tab!=='day'||t.date!==ui.sel)?`<span class="meta">${esc(dateLabel(t.date))}</span>`:'';
  return `<li class="row${t.done?' done':''}"><button class="chk${t.done?' on':''}" data-act="task" data-id="${t.id}" aria-label="انجام شد" aria-pressed="${!!t.done}"></button>
    <div class="ti">${esc(t.title)}${meta}</div>
    <button class="star${t.star?' on':''}" data-act="star" data-id="${t.id}" aria-label="مهم" aria-pressed="${!!t.star}">★</button>
    <button class="del" data-act="delTask" data-id="${t.id}" aria-label="حذف">×</button></li>`;
}

function viewTasks(){
  const tk=todayKey();
  let list=state.tasks.slice();
  if(ui.filter==='open')list=list.filter(t=>!t.done);
  if(ui.filter==='today')list=list.filter(t=>t.date&&t.date<=tk&&!t.done);
  if(ui.filter==='done')list=list.filter(t=>t.done);
  list.sort((a,b)=>((b.star?1:0)-(a.star?1:0))||((a.date||'9')<(b.date||'9')?-1:(a.date||'9')>(b.date||'9')?1:0));
  const f=(k,l)=>`<button class="${ui.filter===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`;
  const empty={open:'همه‌ی کارها انجام شده. کار تازه‌ای بنویسید.',today:'برای امروز کار باقی‌مانده‌ای نیست.',done:'هنوز کاری تیک نخورده.'}[ui.filter];
  return `<header class="top"><div><h1>کارها</h1><div class="sub">${fa(state.tasks.filter(t=>!t.done).length)} کار باز</div></div>${syncHTML()}</header>
    <div class="quick"><input id="qtask" placeholder="کار جدید… (Enter)" aria-label="کار جدید" enterkeyhint="done"><button data-act="quickTask">افزودن</button></div>
    <div class="seg">${f('open','باز')}${f('today','امروز')}${f('done','انجام‌شده')}</div>
    ${list.length?`<ul class="list">${list.map(taskRow).join('')}</ul>`:`<div class="empty">${empty}</div>`}`;
}

function viewHabits(){
  const tk=todayKey();
  const body=state.habits.length?state.habits.map(h=>{
    let days='';
    for(let i=6;i>=0;i--){
      const d=addDays(new Date(),-i),k=dkey(d);
      days+=`<button class="hday${h.log[k]?' on':''}${k===tk?' today':''}" data-act="habit" data-id="${h.id}" data-k="${k}" aria-pressed="${!!h.log[k]}" aria-label="${esc(fmt(d,{weekday:'long'}))}"><i></i>${fmt(d,{weekday:'narrow'})}</button>`;
    }
    const s=streak(h);
    return `<div class="habit"><div class="hd"><div class="ti">${esc(h.title)}</div>
      <span class="streak">${s?`<b>${fa(s)}</b> روز پیاپی`:'از امروز شروع کنید'}</span>
      <button class="del" data-act="delHabit" data-id="${h.id}" aria-label="حذف">×</button></div>
      <div class="hweek">${days}</div></div>`}).join('')
    :`<div class="empty">عادتی که می‌خواهید هر روز انجام دهید را اضافه کنید؛ مثلاً «۲۰ دقیقه مطالعه». <button data-act="open" data-type="habit">افزودن عادت</button></div>`;
  return `<header class="top"><div><h1>عادت‌ها</h1><div class="sub">هفت روز گذشته</div></div>${syncHTML()}</header>${body}`;
}

function viewGoals(){
  const body=state.goals.length?state.goals.map(g=>{
    const n=g.steps.length,d=g.steps.filter(s=>s.done).length,p=n?Math.round(d/n*100):0;
    return `<div class="goal"><div class="hd"><div class="ti">${esc(g.title)}</div>
      <button class="del" data-act="delGoal" data-id="${g.id}" aria-label="حذف هدف">×</button></div>
      <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
      <div class="meta">${n?`${fa(p)}٪ · ${fa(d)} از ${fa(n)} گام`:'هنوز گامی ندارد'}${g.deadline?` · تا ${esc(dateLabel(g.deadline))}`:''}</div>
      <ul class="steps">${g.steps.map(s=>`<li class="${s.done?'done':''}"><button class="chk${s.done?' on':''}" data-act="step" data-g="${g.id}" data-id="${s.id}" aria-pressed="${!!s.done}" aria-label="انجام شد"></button><span class="ti">${esc(s.title)}</span><button class="del" data-act="delStep" data-g="${g.id}" data-id="${s.id}" aria-label="حذف گام">×</button></li>`).join('')}</ul>
      <div class="add"><input data-step-for="${g.id}" placeholder="گام بعدی…" aria-label="گام جدید" enterkeyhint="done"><button data-act="addStep" data-g="${g.id}">افزودن</button></div></div>`}).join('')
    :`<div class="empty">یک هدف بزرگ بنویسید و آن را به گام‌های کوچک بشکنید. <button data-act="open" data-type="goal">افزودن هدف</button></div>`;
  return `<header class="top"><div><h1>اهداف</h1><div class="sub">${fa(state.goals.length)} هدف</div></div>${syncHTML()}</header>${body}`;
}

function render(){
  const v={day:viewDay,tasks:viewTasks,habits:viewHabits,goals:viewGoals}[ui.tab]||viewDay;
  $('#app').innerHTML=v();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
}

/* ---------- sheet ---------- */
const TYPES=[['event','رویداد'],['task','کار'],['habit','عادت'],['goal','هدف']];
function openSheet(type){
  ui.sheetType=type||({day:'event',tasks:'task',habits:'habit',goals:'goal'}[ui.tab]);
  drawSheet();$('#scrim').classList.add('open');
  setTimeout(()=>{const i=$('#f-title');if(i)i.focus()},60);
}
function drawSheet(){
  const t=ui.sheetType,seg=TYPES.map(([k,l])=>`<button type="button" class="${k===t?'on':''}" data-act="stype" data-type="${k}">${l}</button>`).join('');
  let f=`<label class="field"><span>عنوان</span><input id="f-title" required maxlength="140"></label>`;
  if(t==='event')f+=`<label class="field"><span>تاریخ</span><input id="f-date" type="date" value="${ui.sel}"></label>
    <div class="pair"><label class="field"><span>شروع</span><input id="f-start" type="time" value="09:00"></label><label class="field"><span>پایان (اختیاری)</span><input id="f-end" type="time"></label></div>`;
  if(t==='task')f+=`<label class="field"><span>تاریخ (اختیاری)</span><input id="f-date" type="date" value="${ui.tab==='day'?ui.sel:''}"></label>
    <label class="checkline"><input id="f-star" type="checkbox"> مهم</label>`;
  if(t==='goal')f+=`<label class="field"><span>مهلت (اختیاری)</span><input id="f-date" type="date"></label>
    <label class="field"><span>گام‌ها — هر خط یک گام</span><textarea id="f-steps"></textarea></label>`;
  $('#sheet').innerHTML=`<h3>افزودن</h3><div class="seg">${seg}</div>${f}<div class="err" id="f-err"></div>
    <div class="actions"><button class="btn" type="submit">ذخیره</button><button class="ghost" type="button" data-act="close">انصراف</button></div>`;
}
function closeSheet(){$('#scrim').classList.remove('open')}
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('#f-title').value.trim();
  if(!title){$('#f-err').textContent='یک عنوان بنویسید.';return}
  const v=id=>{const el=$(id);return el?el.value:''};
  const t=ui.sheetType;
  if(t==='event'){
    if(!v('#f-date')){$('#f-err').textContent='تاریخ را انتخاب کنید.';return}
    if(v('#f-end')&&v('#f-end')<v('#f-start')){$('#f-err').textContent='زمان پایان باید بعد از شروع باشد.';return}
    state.events.push({id:uid(),title,date:v('#f-date'),start:v('#f-start'),end:v('#f-end')});
    ui.sel=v('#f-date');
  }
  if(t==='task')state.tasks.push({id:uid(),title,date:v('#f-date')||null,star:$('#f-star').checked,done:false});
  if(t==='habit')state.habits.push({id:uid(),title,log:{}});
  if(t==='goal')state.goals.push({id:uid(),title,deadline:v('#f-date')||null,
    steps:v('#f-steps').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({id:uid(),title:s,done:false}))});
  closeSheet();persist();
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- actions ---------- */
const find=(arr,id)=>arr.find(x=>x.id===id);
function addStep(gid){
  const inp=document.querySelector(`[data-step-for="${gid}"]`);const val=inp&&inp.value.trim();if(!val)return;
  find(state.goals,gid).steps.push({id:uid(),title:val,done:false});persist();
  const n=document.querySelector(`[data-step-for="${gid}"]`);if(n)n.focus();
}
function quickTask(){
  const i=$('#qtask');const val=i&&i.value.trim();if(!val)return;
  state.tasks.push({id:uid(),title:val,date:ui.filter==='today'?todayKey():null,star:false,done:false});persist();
  const n=$('#qtask');if(n)n.focus();
}
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ui.tab=tab.dataset.tab;try{sessionStorage.setItem('planner-tab',ui.tab)}catch(x){}render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'sel':ui.sel=b.dataset.k;render();break;
    case 'today':ui.sel=todayKey();render();break;
    case 'week':ui.sel=dkey(addDays(parseKey(ui.sel),+b.dataset.n));render();break;
    case 'open':openSheet(b.dataset.type);break;
    case 'stype':ui.sheetType=b.dataset.type;const keep=$('#f-title').value;drawSheet();$('#f-title').value=keep;$('#f-title').focus();break;
    case 'close':closeSheet();break;
    case 'task':{const t=find(state.tasks,id);t.done=!t.done;persist();break}
    case 'star':{const t=find(state.tasks,id);t.star=!t.star;persist();break}
    case 'delTask':state.tasks=state.tasks.filter(t=>t.id!==id);persist();break;
    case 'delEvent':state.events=state.events.filter(t=>t.id!==id);persist();break;
    case 'habit':{const h=find(state.habits,id),k=b.dataset.k;if(h.log[k])delete h.log[k];else h.log[k]=true;persist();break}
    case 'delHabit':if(confirm('این عادت و سابقه‌اش حذف شود؟')){state.habits=state.habits.filter(h=>h.id!==id);persist()}break;
    case 'delGoal':if(confirm('این هدف حذف شود؟')){state.goals=state.goals.filter(g=>g.id!==id);persist()}break;
    case 'step':{const s=find(find(state.goals,b.dataset.g).steps,id);s.done=!s.done;persist();break}
    case 'delStep':{const g=find(state.goals,b.dataset.g);g.steps=g.steps.filter(s=>s.id!==id);persist();break}
    case 'addStep':addStep(b.dataset.g);break;
    case 'filter':ui.filter=b.dataset.f;render();break;
    case 'quickTask':quickTask();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='qtask'){e.preventDefault();quickTask()}
  else if(e.target.dataset&&e.target.dataset.stepFor){e.preventDefault();addStep(e.target.dataset.stepFor)}
});
$('#fab').addEventListener('click',()=>openSheet());

/* keep "now" highlight fresh */
setInterval(()=>{if(ui.tab==='day'&&!$('#scrim').classList.contains('open')&&!document.activeElement.matches('input,textarea'))render()},60000);

render();

/* ---------- account sync (when opened in Claude) ---------- */
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const me=await user.id();if(!me)return;
    docRef=db.doc('data/users/'+me+'/planner');
    const snap=await docRef.get();
    if(snap.exists){
      const r=snap.data()||{};
      if((r.updatedAt||0)>(state.updatedAt||0)){
        state=Object.assign(blank(),JSON.parse(JSON.stringify(r)));
        try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
        synced=true;render();return;
      }
      if((r.updatedAt||0)<(state.updatedAt||0)){scheduleSync();return}
      synced=true;renderSync();
    }else if(state.updatedAt){scheduleSync()}
    else{synced=true;renderSync()}
  }catch(e){}
})();
})();
</script>
</body>
</html>
