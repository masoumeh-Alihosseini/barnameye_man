<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه‌ی من</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("fonts/Vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Sahel";src:url("fonts/Sahel-VF.woff2") format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"Shabnam";src:url("fonts/Shabnam.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Shabnam";src:url("fonts/Shabnam-Bold.woff2") format("woff2");font-weight:600 900;font-display:swap}
@font-face{font-family:"Estedad";src:url("fonts/Estedad.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Estedad";src:url("fonts/Estedad-Bold.woff2") format("woff2");font-weight:600 900;font-display:swap}
@font-face{font-family:"Noto Naskh Arabic";src:url("fonts/NotoNaskh.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Playpen";src:url("fonts/Playpen.woff2") format("woff2");font-weight:100 800;font-display:swap}
@font-face{font-family:"Noto Naskh Arabic";src:url("fonts/NotoNaskh-Bold.woff2") format("woff2");font-weight:600 900;font-display:swap}

:root{
  --bg:#EDF0EB;--surface:#FFFFFF;--ink:#1D2729;--muted:#6B7773;--line:#D8DDD7;
  --accent:#1F6F6B;--accent-ink:#FFFFFF;--accent-soft:#D6E8E5;
  --sun:#D9952B;--sun-soft:#F6E5C3;--danger:#B4473C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131919;--surface:#1D2527;--ink:#E5ECE9;--muted:#93A09B;--line:#2D3638;
    --accent:#5BB5AC;--accent-ink:#0E1515;--accent-soft:#213937;
    --sun:#F0B955;--sun-soft:#3A3122;--danger:#E07A6F;
  }
}
:root[data-theme="dark"]{
  --bg:#131919;--surface:#1D2527;--ink:#E5ECE9;--muted:#93A09B;--line:#2D3638;
  --accent:#5BB5AC;--accent-ink:#0E1515;--accent-soft:#213937;
  --sun:#F0B955;--sun-soft:#3A3122;--danger:#E07A6F;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:10px 0 14px}
.top h1{font-size:1.9rem;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--ink)}

/* week strip: the one bold element */
.week{display:flex;align-items:center;gap:6px;margin:4px 0 22px}
.week .nav{flex:none;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:1.2rem}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dayb{border:none;background:transparent;border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.dayb .wd{font-size:.78rem;color:var(--muted)}
.dayb .dn{font-size:1.35rem;font-weight:700;line-height:1.3}
.dayb .dot{width:5px;height:5px;border-radius:50%;margin-top:3px;background:transparent}
.dayb .dot.on{background:var(--muted)}
.dayb.today .dn{color:var(--sun)}
.dayb.sel{background:var(--ink);color:var(--bg)}
.dayb.sel .wd{color:var(--bg);opacity:.7}
.dayb.sel .dn{color:var(--bg)}
.dayb.sel .dot.on{background:var(--sun)}

/* sections */
h2{font-size:1rem;font-weight:700;margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2 small{font-weight:400;color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-size:.92rem;padding:14px 16px;border:1.5px dashed var(--line);border-radius:14px}
.empty button{background:none;border:none;color:var(--accent);font-weight:700;padding:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:none}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-size:.95rem;padding-top:1px}
.tl .t span{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tl .ti{font-weight:500;overflow-wrap:anywhere}
.tl li.now .t{color:var(--sun)}
.tl li.past .ti{color:var(--muted)}

/* rows */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ti{flex:1;min-width:0;overflow-wrap:anywhere}
.row .meta{display:block;font-size:.78rem;color:var(--muted)}
.row.done .ti{color:var(--muted);text-decoration:line-through}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.star{flex:none;border:none;background:none;font-size:1.15rem;color:var(--line);padding:2px}
.star.on{color:var(--sun)}
.del{flex:none;border:none;background:none;color:var(--muted);font-size:1.25rem;line-height:1;padding:4px 6px;border-radius:8px}
.del:hover{color:var(--danger)}

/* habit chips on day view */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.on::before{content:"✓ ";color:var(--accent);font-weight:700}

/* segmented */
.seg{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:7px 4px;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.quick button,.btn{border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:700}

/* habits */
.habit{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px}
.habit .hd{display:flex;align-items:center;gap:8px}
.habit .hd .ti{flex:1;font-weight:700;overflow-wrap:anywhere}
.streak{font-size:.8rem;color:var(--muted)}
.streak b{color:var(--sun);font-weight:800}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.hday{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:0;font-size:.72rem;color:var(--muted)}
.hday i{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:block}
.hday.on i{background:var(--accent);border-color:var(--accent)}
.hday.today{color:var(--ink);font-weight:700}

/* goals */
.goal{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.goal .hd{display:flex;align-items:flex-start;gap:8px}
.goal .hd .ti{flex:1;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.goal .meta{font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.goal .steps{list-style:none;margin:8px 0 0;padding:0}
.goal .steps li{display:flex;align-items:center;gap:10px;padding:6px 0}
.goal .steps li .ti{flex:1;font-size:.93rem;overflow-wrap:anywhere}
.goal .steps li.done .ti{color:var(--muted);text-decoration:line-through}
.goal .steps .chk{width:20px;height:20px;border-radius:6px}
.goal .steps .chk.on::after{width:5px;height:9px}
.goal .add{display:flex;gap:6px;margin-top:8px}
.goal .add input{flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--line);background:transparent;padding:6px 2px;font-size:.9rem}
.goal .add button{border:none;background:none;color:var(--accent);font-weight:700}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:none;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:6;left:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;border:none;background:var(--sun);color:#1D2729;font-size:1.9rem;line-height:1;
  box-shadow:0 6px 18px -6px rgba(120,80,10,.5)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,15,15,.45);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:90%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h3{margin:0 0 12px;font-size:1.15rem}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.field textarea{min-height:90px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkline{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.95rem}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1;padding:12px}
.actions .ghost{padding:12px 18px;border-radius:12px}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:-4px 0 8px}

.tabs .in{grid-template-columns:repeat(5,1fr)}
.who{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.who i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.avs{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;margin-top:4px}
.avs img{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);object-fit:cover;background:var(--line)}
.avs img+img{margin-inline-start:-9px}
.banner{background:var(--surface);border-inline-start:4px solid var(--sun);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:.92rem}
.banner.info{border-color:var(--accent)}
.banner .acts{display:flex;gap:8px;margin-top:10px}
.banner .acts .btn{padding:8px 14px}
.banner .acts .ghost{padding:8px 14px;border-radius:12px}
.odots{display:inline-flex;gap:2px;margin-inline-start:6px;vertical-align:middle}
.odots i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tl .by{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.others{margin-top:10px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.feed{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.feed li{padding:11px 14px;border-bottom:1px solid var(--line);font-size:.93rem;line-height:1.55}
.feed li:last-child{border-bottom:none}
.feed .who{font-weight:700}
.feed .when{display:block;font-size:.75rem;color:var(--muted)}
.feed .day{background:var(--bg);color:var(--muted);font-size:.8rem;font-weight:700;padding:6px 14px}
.field select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90%;display:none}
.toast.show{display:block}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.step-by{font-size:.72rem;color:var(--muted);margin-inline-start:4px}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.seg.mini{margin:0;padding:3px;width:auto;flex:none}
.seg.mini button{padding:4px 14px;font-size:.85rem;flex:none}
.stepchip{font-size:.85rem;background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--ink)}
.mhead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.mhead strong{min-width:120px;text-align:center}
.mhead .nav,.mnav .nav{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:1.2rem}
.mnav{display:inline-flex;align-items:center;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.mg-wd{text-align:center;font-size:.75rem;color:var(--muted);padding:2px 0}
.mg-d{border:none;background:var(--surface);border-radius:12px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;min-width:0}
.mg-d .n{font-weight:700;font-size:1rem;line-height:1}
.mg-d .mk{display:flex;gap:2px;height:6px}
.mg-d.today .n{color:var(--sun)}
.mg-d.sel{background:var(--ink);color:var(--bg)}
.mg-d.sel .n{color:var(--bg)}
.mk i,.mlegend i{width:6px;height:6px;border-radius:50%;display:inline-block}
i.e{background:var(--accent)} i.t{background:var(--sun)} i.h{background:var(--muted)}
.mg-d.sel i.h{background:var(--bg)}
.mlegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.78rem;color:var(--muted);margin:4px 0 18px}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:1rem;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:.8rem}
.card .empty{border-color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{display:flex;flex-direction:column;gap:0}
.stat b{font-size:1.35rem;font-weight:800;line-height:1.3}
.stat span{font-size:.75rem;color:var(--muted)}
.chart{width:100%;height:130px;display:block;overflow:visible}
.chart rect.b{fill:var(--accent)} .chart rect.bt{fill:var(--sun)} .chart rect.bf{fill:var(--line)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart text{font-size:7px;fill:var(--muted);font-family:inherit}
.heat{margin-bottom:4px}
.hm{aspect-ratio:1/1;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;font-size:.72rem;background:var(--bg)}
.hm span{position:relative}
.hm.l1{background:color-mix(in srgb,var(--accent) 25%,var(--bg))}
.hm.l2{background:color-mix(in srgb,var(--accent) 50%,var(--bg))}
.hm.l3{background:color-mix(in srgb,var(--accent) 75%,var(--bg))}
.hm.l4{background:var(--accent);color:var(--accent-ink)}
.hm.l-1{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.hm.today{outline:2px solid var(--sun);outline-offset:-2px}
.mlegend i.hm{width:14px;height:14px;border-radius:4px;aspect-ratio:auto}
.hlist{list-style:none;margin:10px 0 0;padding:0}
.hlist li{display:grid;grid-template-columns:1fr 70px 48px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.hlist .ti{overflow-wrap:anywhere}
.hlist .meta{display:block;font-size:.75rem;color:var(--muted)}
.hlist .meta.late{color:var(--danger)}
.minibar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}
.pc{font-size:.8rem;color:var(--muted);text-align:left;font-variant-numeric:tabular-nums}

body{font-family:var(--font,"Vazirmatn"),"Vazirmatn",Tahoma,sans-serif}
button,input,textarea,select{font-family:inherit}
:root[data-pal="rose"][data-theme]{--bg:#F6EEEE;--surface:#FFFFFF;--ink:#2B1F24;--muted:#8A7479;--line:#EADBDD;--accent:#B24A6A;--accent-ink:#FFFFFF;--accent-soft:#F3D9E0;--sun:#D9893A;--sun-soft:#F8E4CC;--danger:#B4473C}
:root[data-pal="ocean"][data-theme]{--bg:#EAF0F5;--surface:#FFFFFF;--ink:#17222D;--muted:#6A7C8C;--line:#D5DFE8;--accent:#2563A8;--accent-ink:#FFFFFF;--accent-soft:#D6E4F4;--sun:#DB9A2B;--sun-soft:#F6E6C6;--danger:#B4473C}
:root[data-pal="lav"][data-theme]{--bg:#EFEDF6;--surface:#FFFFFF;--ink:#221F2E;--muted:#7B7690;--line:#DDD9EA;--accent:#6A55B5;--accent-ink:#FFFFFF;--accent-soft:#E2DDF5;--sun:#DC9536;--sun-soft:#F6E4CA;--danger:#B4473C}
:root[data-pal="sand"][data-theme]{--bg:#F3EEE4;--surface:#FFFDF8;--ink:#2A2620;--muted:#857B6C;--line:#E4DCCB;--accent:#5F6F2E;--accent-ink:#FFFFFF;--accent-soft:#E4E8D0;--sun:#C9772E;--sun-soft:#F3DFC9;--danger:#A8412F}
:root[data-pal="night"][data-theme]{--bg:#101418;--surface:#1A2027;--ink:#E6EBF0;--muted:#8C98A4;--line:#28313A;--accent:#7FB5E8;--accent-ink:#0E141A;--accent-soft:#1E2F40;--sun:#F0B955;--sun-soft:#3A3122;--danger:#E07A6F}
.tabs .in{grid-template-columns:repeat(4,1fr)}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin:10px 0 16px}
.hero .wd{color:var(--accent);font-weight:700;font-size:1rem}
.hero .dt{font-size:1.85rem;font-weight:800;line-height:1.25}
.hero .sub{color:var(--muted);font-size:.82rem;margin-top:2px}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.clock{font-size:2.3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.gear{width:38px;height:38px;border-radius:12px;border:none;background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}
.quote{margin:0 0 16px;background:var(--surface);border-radius:18px;padding:16px 18px;border-inline-start:4px solid var(--sun)}
.quote p{margin:0;font-family:"Noto Naskh Arabic",var(--font),serif;font-size:1.12rem;line-height:2;white-space:pre-line}
.quote figcaption{margin-top:6px;color:var(--muted);font-size:.85rem}
.dayprog{display:flex;align-items:center;gap:12px;margin:0 0 6px;font-size:.85rem;color:var(--muted)}
.dayprog .bar{flex:1;margin:0}

<script>
(function(){
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const faN=n=>fa(Math.round(n).toLocaleString('en'));
const fmt=(d,o)=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d)}catch(e){return d.toLocaleDateString()}};
const greg=(d,o)=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-gregory',o).format(d)}catch(e){return ''}};
const hijri=d=>{for(const c of ['islamic-umalqura','islamic-civil','islamic']){try{return new Intl.DateTimeFormat('fa-IR-u-ca-'+c,{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){}}return ''};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u||'').trim();if(!u)return '';if(/^(javascript|data|vbscript):/i.test(u))return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return u};
const toMin=t=>{if(!t)return -1;const p=t.split(':');return (+p[0])*60+(+p[1])};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const NATIVE=!!(window.Capacitor&&typeof window.Capacitor.nativePromise==='function');
const H=(m,o)=>window.Capacitor.nativePromise('Health',m,o||{});

const NP=(p,m,o)=>window.Capacitor.nativePromise(p,m,o||{});
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------------- state ---------------- */
const KEY='planner-v3';
const DEF_SETTINGS={hand:true,pal:'auto',font:'Vazirmatn',dayStart:4,eventRemind:10,gratRemind:'22:00',stepGoal:8000};
const S={tasks:[],events:[],habits:[],goals:[],grat:{},settings:Object.assign({},DEF_SETTINGS),seeded:false,pomo:null,pomoRun:null,lastBackup:null};
function normalize(){
  S.pomo=Object.assign({focus:25,short:5,long:15,every:4,log:[]},S.pomo||{});if(!Array.isArray(S.pomo.log))S.pomo.log=[];
  S.goals.forEach(g=>{if(!g.period){g.period='long';g.pkey=null}if(!g.steps)g.steps={}});
  S.habits.forEach(h=>{if(h.app==null)h.app=''});
  S.tasks.forEach(t=>{if(!t.subs)t.subs={}});

function load(){
  try{
    const v3=lsGet(KEY);
    if(v3){const d=JSON.parse(v3);Object.assign(S,d);S.settings=Object.assign({},DEF_SETTINGS,d.settings||{});return}
    let d=null;const v2=lsGet('planner-v2'),v1=lsGet('planner-v1');
    if(v2)d=JSON.parse(v2);else if(v1)d=JSON.parse(v1);
    if(!d)return;
    S.tasks=(d.tasks||[]).map(t=>({id:t.id||uid(),title:t.title,date:t.date||null,star:!!t.star,done:!!t.done,doneAt:t.doneAt||null,subs:{}}));
    S.events=(d.events||[]).map(e=>({id:e.id||uid(),title:e.title,date:e.date,start:e.start||'',end:e.end||''}));

/* ---------------- Persian month helpers ---------------- */
let pFmt=null;try{pFmt=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'})}catch(e){}
function pParts(d){
  if(!pFmt)return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};
  const o={};pFmt.formatToParts(d).forEach(p=>{if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type]=parseInt(p.value,10)});return o;
}
function monthRange(d){
  const p=pParts(d),start=addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-(p.day-1));
  let len=0,x=new Date(start);while(pParts(x).month===p.month&&len<32){len++;x=addDays(x,1)}
  const keys=[];for(let i=0;i<len;i++)keys.push(dkey(addDays(start,i)));
  return {start,len,keys,label:fmt(start,{month:'long',year:'numeric'})};
}
function shiftMonth(k,n){const r=monthRange(parseKey(k)),t=monthRange(n<0?addDays(r.start,-1):addDays(r.start,r.len)),tk=todayKey();return t.keys.includes(tk)?tk:t.keys[0]}
function weekStart(k){const d=parseKey(k);return addDays(d,-((d.getDay()+1)%7))}
function yearStart(k){let x=monthRange(parseKey(k)).start,g=0;while(pParts(x).month>1&&g<13){x=monthRange(addDays(x,-1)).start;g++}return x}
function periodKey(type,k){if(type==='week')return dkey(weekStart(k));if(type==='month')return monthRange(parseKey(k)).keys[0];if(type==='year')return dkey(yearStart(k));return null}
function periodLabel(type,key){
  if(type==='long'||!key)return 'بدون بازه‌ی زمانی';
  const d=parseKey(key);
  if(type==='week'){const e=addDays(d,6);return `${fmt(d,{day:'numeric',month:'long'})} تا ${fmt(e,{day:'numeric',month:'long'})}`}
  if(type==='month')return monthRange(d).label;
  return 'سال '+fmt(d,{year:'numeric'});
}
function shiftPeriod(type,key,n){
  const d=parseKey(key);
  if(type==='week')return dkey(addDays(d,7*n));
  if(type==='month')return periodKey('month',n<0?dkey(addDays(d,-1)):dkey(addDays(d,monthRange(d).len)));
  if(type==='year'){if(n<0)return periodKey('year',dkey(addDays(d,-1)));let x=d;for(let i=0;i<12;i++)x=addDays(x,monthRange(x).len);return periodKey('year',dkey(x))}
  return key;
}

function dateLabel(k){
  if(!k)return '';const t=todayKey();
  if(k===t)return 'امروز';
  if(k===dkey(addDays(parseKey(t),1)))return 'فردا';
  if(k===dkey(addDays(parseKey(t),-1)))return 'دیروز';
  return fmt(parseKey(k),{weekday:'long',day:'numeric',month:'long'});
}

    steps.st=((s&&s.readAuthorized)||[]).includes('steps')?'ok':'need';
  }catch(e){steps.st='unavailable'}
  scheduleRender();
}
async function stepsConnect(){
  try{const s=await H('requestAuthorization',{read:['steps'],write:[]});
    steps.st=((s&&s.readAuthorized)||[]).includes('steps')?'ok':'denied';steps.loaded={};}
  catch(e){steps.st='denied'}
  scheduleRender();
}
async function stepsLoad(r){
  const key=r.keys[0];if(steps.st!=='ok'||steps.loaded[key])return;
  const now=new Date();if(r.start>now){steps.loaded[key]='done';return}
  steps.loaded[key]='loading';
  const end=addDays(r.start,r.len),e=end>now?now:end;
  try{
    const res=await H('queryAggregated',{dataType:'steps',startDate:r.start.toISOString(),endDate:e.toISOString(),bucket:'day',aggregation:'sum'});
    ((res&&res.samples)||[]).forEach(x=>{const k=dkey(new Date(x.startDate));steps.days[k]=Math.round(x.value||0)});
    steps.loaded[key]='done';
  }catch(err){steps.loaded[key]='error'}
  scheduleRender();queueReschedule();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(steps.st==='ok'){const k=monthRange(new Date()).keys[0];delete steps.loaded[k]}
  scheduleRender();queueReschedule();
});

let rsT=null;const notif={perm:null,exact:null};
function queueReschedule(){if(!NATIVE)return;clearTimeout(rsT);rsT=setTimeout(reschedule,1500)}
async function reschedule(){
  try{
    const p=await N('getPending');
    const old=((p&&p.notifications)||[]).filter(n=>n.id!==9999&&n.id!==9000).map(n=>({id:n.id}));
    if(old.length)await N('cancel',{notifications:old});
    const list=[];let id=1;const now=Date.now(),st=S.settings;
    const add=(title,body,d)=>{if(d.getTime()>now+5000&&list.length<64)list.push({id:id++,title,body,schedule:{at:d.toISOString(),allowWhileIdle:true}})};
    if(+st.eventRemind>0)S.events.forEach(e=>{
      if(!e.start||!e.date)return;const d=parseKey(e.date),[h,m]=e.start.split(':').map(Number);d.setHours(h,m,0,0);
      const at=new Date(d.getTime()-st.eventRemind*60000);if(at.getTime()<now+14*864e5)add(e.title,`ساعت ${fa(e.start)}، ${fa(st.eventRemind)} دقیقه‌ی دیگر`,at)});
    const daily=(time,skip,title,body)=>{const [hh,mm]=time.split(':').map(Number);
      for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);d.setHours(hh,mm,0,0);if(skip(logicalKey(d)))continue;add(title,body,d)}};
    S.habits.forEach(h=>{if(h.remind)daily(h.remind,k=>isDone(h,k),h.title,'یادت نره امروز تیکش رو بزنی ✨')});
    if(st.gratRemind)daily(st.gratRemind,k=>(S.grat[k]||[]).some(x=>x&&x.trim()),'شکرگزاری امروز','پنج چیز خوب امروز رو بنویس 🌿');
    if(list.length){const r=await N('schedule',{notifications:list});notif.perm='granted';return r}
  }catch(e){if(String(e&&e.message||e).match(/permission/i))notif.perm='denied'}
}
async function notifStatus(){
  if(!NATIVE)return;
  try{const p=await N('checkPermissions');notif.perm=p&&p.display}catch(e){}
  try{const x=await N('checkExactNotificationSetting');notif.exact=x&&x.exact_alarm}catch(e){}

}

function habitRow(h,k){

  const title=`<div class="ti" data-act="edit" data-col="habits" data-id="${h.id}">${esc(h.title)}${meta.length?`<span class="meta">${meta.join(' · ')}</span>`:''}</div>`;

function barChart(vals,keys,label){
  const n=vals.length,step=12,W=n*step,Hh=110,max=Math.max(1,...vals),tk=todayKey();
  let bars='',labels='';
  vals.forEach((v,i)=>{const h=v?Math.max(3,Math.round(v/max*(Hh-8))):0,x=W-(i+1)*step+2;
    const cls=keys[i]===tk?'bt':(keys[i]>tk?'bf':'b');

/* ---------------- POMODORO ---------------- */
const PHASE={focus:'تمرکز',short:'استراحت کوتاه',long:'استراحت بلند'};
function pomoLen(ph){return (+S.pomo[ph==='focus'?'focus':ph]||5)*60000}
function pomoLeft(){const r=S.pomoRun;if(!r)return 0;return r.paused?r.left:Math.max(0,r.endAt-Date.now())}
function mmss(ms){const t=Math.ceil(ms/1000);return fa(pad(Math.floor(t/60))+':'+pad(t%60))}
function pomoNotify(){
  if(!NATIVE)return;const r=S.pomoRun;
  N('cancel',{notifications:[{id:9000}]}).catch(()=>{}).then(()=>{
    if(!r||r.paused)return;
    const next=r.phase==='focus'?'وقت استراحته ☕':'وقت برگشتن به تمرکزه 🍅';
    N('schedule',{notifications:[{id:9000,title:`پایان ${PHASE[r.phase]}`,body:(r.title?r.title+' · ':'')+next,schedule:{at:new Date(r.endAt).toISOString(),allowWhileIdle:true}}]}).catch(()=>{});
  });
}
function pomoTargetList(){
  const k=todayKey(),out=[['','بدون موضوع مشخص']];
  S.habits.filter(h=>h.type==='min').forEach(h=>out.push(['habit:'+h.id,'عادت · '+h.title]));
  S.tasks.filter(t=>!t.done&&(!t.date||t.date<=k)).slice(0,25).forEach(t=>out.push(['task:'+t.id,'کار · '+t.title]));
  S.goals.filter(g=>g.period==='long'||g.pkey===periodKey(g.period,k)).forEach(g=>out.push(['goal:'+g.id,'هدف · '+g.title]));
  return out;
}
function targetTitle(v){const t=pomoTargetList().find(x=>x[0]===v);return v&&t?t[1].replace(/^[^·]*·\s*/,''):''}
function pomoStart(phase){
  const [kind,id]=(ui.ptarget||'').split(':');
  const prev=S.pomoRun||{};
  const len=pomoLen(phase);
  S.pomoRun={phase,endAt:Date.now()+len,total:len,paused:false,left:len,kind:phase==='focus'?(kind||''):(prev.kind||''),id:phase==='focus'?(id||''):(prev.id||''),
    title:phase==='focus'?targetTitle(ui.ptarget):(prev.title||''),count:prev.count||0,startedAt:Date.now()};
  save();pomoNotify();
}
function pomoCredit(min){
  const r=S.pomoRun;if(!r||min<1)return;
  S.pomo.log.push({at:Date.now(),min,kind:r.kind,id:r.id,title:r.title});
  if(S.pomo.log.length>3000)S.pomo.log=S.pomo.log.slice(-3000);
  if(r.kind==='habit'){const h=find('habits',r.id);if(h&&h.type==='min'){const k=todayKey();h.log=h.log||{};h.log[k]=(+h.log[k]||0)+min}}
  if(r.kind==='task'){const t=find('tasks',r.id);if(t)t.focusMin=(t.focusMin||0)+min}
}
function pomoFinish(){
  const r=S.pomoRun;if(!r)return;
  if(r.phase==='focus'){pomoCredit(Math.round(r.total/60000));r.count=(r.count||0)+1;
    const next=r.count%(+S.pomo.every||4)===0?'long':'short';Object.assign(r,{phase:next,paused:true,left:pomoLen(next),total:pomoLen(next),endAt:0,ready:true});
    toast('🍅 یک نوبت تمرکز کامل شد!');}
  else{Object.assign(r,{phase:'focus',paused:true,left:pomoLen('focus'),total:pomoLen('focus'),endAt:0,ready:true})}
  save();
}
function pomoTick(){const r=S.pomoRun;if(r&&!r.paused&&Date.now()>=r.endAt)pomoFinish();
  const pill=$('#pomopill');const on=r&&(!r.paused||!r.ready);
  if(pill){pill.hidden=!(r&&ui.tab!=='focus'&&(on||r.ready));if(!pill.hidden)pill.textContent=(r.phase==='focus'?'🍅 ':'☕ ')+(r.ready?'آماده':mmss(pomoLeft()))}
  if(ui.tab==='focus'){const t=$('#ptime');if(t&&r){t.textContent=mmss(pomoLeft());const c=$('#pring');if(c){const f=r.total?1-pomoLeft()/r.total:0;c.style.strokeDashoffset=String(754*(1-f))}}}
}
setInterval(pomoTick,1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pomoTick()});

  const running=r&&!r.paused,paused=r&&r.paused&&!r.ready;

  else if(r.ready)btns=`<button class="btn big" data-act="pstart" data-ph="${r.phase}">شروع ${PHASE[r.phase]} (${fa(Math.round(r.total/60000))} دقیقه)</button><button class="ghost" data-act="pskip">رد کردن</button><button class="ghost" data-act="pstop">پایان</button>`;

  else btns=`<button class="btn big" data-act="presume">ادامه</button><button class="ghost" data-act="pstop">${phase==='focus'?'پایان و ثبت':'پایان'}</button>`;
  const tom=Array.from({length:Math.max(4,todayLog.length)},(_,i)=>`<i class="${i<todayLog.length?'on':''}"></i>`).join('');
  return `<header class="top"><div><h1>تمرکز</h1><div class="sub">پومودورو</div></div><button class="ghost" data-act="back">بازگشت</button></header>
    <div class="focus ${phase}">
      ${stk('tomato','focus-stk')}<div class="phase">${PHASE[phase]}${r&&r.title&&phase==='focus'?` · ${esc(r.title)}`:''}</div>
      <svg class="ring" viewBox="0 0 280 280" aria-hidden="true"><circle cx="140" cy="140" r="120" class="rt"/><circle id="pring" cx="140" cy="140" r="120" class="rp" style="stroke-dasharray:754;stroke-dashoffset:${754*(1-f)}"/></svg>
      <div class="ptime" id="ptime" role="timer">${mmss(left)}</div>
      ${!r||r.ready&&phase==='focus'?`<label class="field"><span>روی چه چیزی تمرکز می‌کنید؟</span><select id="p-target">${opts}</select></label>`:''}
      <div class="pbtns">${btns}</div>
      ${phase==='focus'&&!r?`<button class="linkbtn" data-act="pstart" data-ph="short">فقط یک استراحت کوتاه</button>`:''}
    </div>
    <section class="card"><h3>امروز <small>${fa(mins)} دقیقه</small></h3><div class="tomatoes">${tom}</div>
      ${todayLog.length?`<ul class="hlist">${todayLog.slice().reverse().map(x=>`<li><span class="ti">${esc(x.title||'بدون موضوع')}</span><span></span><span class="pc">${fa(x.min)} د</span></li>`).join('')}</ul>`:''}</section>
    <p class="meta center">دقیقه‌های تمرکز روی یک «عادت دقیقه‌ای» خودکار به همان عادت اضافه می‌شود.</p>`;
}

/* ---------------- BACKUP ---------------- */
async function exportBackup(){
  const json=JSON.stringify({app:'barnameh-man',v:4,at:Date.now(),data:S});
  const name=`barnameh-backup-${todayKey()}.json`;
  try{
    if(NATIVE){
      const w=await NP('Filesystem','writeFile',{path:name,data:json,directory:'CACHE',encoding:'utf8'});
      await NP('Share','share',{title:'پشتیبان برنامه‌ی من',dialogTitle:'ذخیره‌ی پشتیبان',files:[w.uri]});
    }else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click();}
    S.lastBackup=Date.now();save();
  }catch(e){if(!String(e&&e.message||'').match(/cancel/i))toast('ساختن فایل پشتیبان ناموفق بود.')}
}
function importBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);const d=o&&o.data;
    if(!d||!Array.isArray(d.habits)||!Array.isArray(d.tasks))throw 0;
    if(!confirm('همه‌ی داده‌های فعلی با این نسخه‌ی پشتیبان جایگزین شود؟'))return;
    ['tasks','events','habits','goals','grat','settings','pomo','seeded','lastBackup'].forEach(k=>{if(k in d)S[k]=d[k]});
    S.pomoRun=null;S.settings=Object.assign({},DEF_SETTINGS,S.settings||{});normalize();applyLook();save();toast('نسخه‌ی پشتیبان بازگردانی شد.');
  }catch(e){toast('این فایل پشتیبانِ برنامه‌ی من نیست.')}};
  fr.readAsText(file);
}

function render(){
  const ae=document.activeElement;let keep=null;
  if(ae&&ae.tagName==='INPUT'&&$('#app').contains(ae))keep={id:ae.id,step:ae.dataset.stepFor,grat:ae.dataset.grat,val:ae.value,pos:ae.selectionStart};
  const v={today:viewToday,day:viewDay,goals:viewGoals,stats:viewStats,settings:viewSettings,focus:viewFocus}[ui.tab]||viewToday;
  $('#app').innerHTML=v();
  if(keep){let el=null;if(keep.id)el=document.getElementById(keep.id);else if(keep.step)el=document.querySelector(`[data-step-for="${keep.step}"]`);else if(keep.grat!=null)el=document.querySelector(`[data-grat="${keep.grat}"]`);
    if(el){el.value=keep.val;el.focus();try{el.setSelectionRange(keep.pos,keep.pos)}catch(e){}}}
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  $('#fab').style.display=(ui.tab==='stats'||ui.tab==='settings'||ui.tab==='focus')?'none':'';pomoTick();
}

/* ---------------- sheet (add + edit) ---------------- */
const SHEET_TYPES=[['event','رویداد'],['task','کار'],['habit','عادت'],['goal','هدف']];
const COL_OF={event:'events',task:'tasks',habit:'habits',goal:'goals'};
function openSheet(type,item){
  ui.sheetType=type||({today:'habit',day:'event',goals:'goal'}[ui.tab])||'event';ui.editing=item||null;
  drawSheet();$('#scrim').classList.add('open');
  if(!item)setTimeout(()=>{const i=$('#f-title');if(i)i.focus()},60);
}
function drawSheet(){
  const t=ui.sheetType,it=ui.editing||{},ed=!!ui.editing;
  const seg=ed?'':`<div class="seg">${SHEET_TYPES.map(([k,l])=>`<button type="button" class="${k===t?'on':''}" data-act="stype" data-type="${k}">${l}</button>`).join('')}</div>`;
  let f=`<label class="field"><span>عنوان</span><input id="f-title" required maxlength="140" value="${esc(it.title||'')}"></label>`;
  if(t==='event')f+=`<label class="field"><span>تاریخ</span><input id="f-date" type="date" value="${esc(it.date||ui.sel||todayKey())}"></label>
    <div class="pair"><label class="field"><span>شروع</span><input id="f-start" type="time" value="${esc(it.start||'09:00')}"></label><label class="field"><span>پایان (اختیاری)</span><input id="f-end" type="time" value="${esc(it.end||'')}"></label></div>`;
  if(t==='task'){
    f+=`<label class="field"><span>تاریخ (اختیاری)</span><input id="f-date" type="date" value="${esc(ed?(it.date||''):(ui.tab==='day'?ui.sel:''))}"></label>
      <label class="checkline"><input id="f-star" type="checkbox"${it.star?' checked':''}> مهم</label>`;
    const subs=Object.entries(it.subs||{}).filter(([,s])=>s&&!s.deleted).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    f+=`<label class="field"><span>گام‌ها (هر خط یک گام)</span><textarea id="f-subs">${esc(subs.map(([,s])=>s.title).join('\n'))}</textarea></label>`;
    if(subs.length)f+=`<ul class="steps sheet-steps">${subs.map(([sid,s])=>`<li class="${s.done?'done':''}"><button type="button" class="chk${s.done?' on':''}" data-act="sub" data-id="${sid}" aria-pressed="${!!s.done}"></button><span class="ti">${esc(s.title)}</span></li>`).join('')}</ul>`;
  }
  if(t==='habit'){
    const ty=it.type||'check';
    f+=`<div class="pair"><label class="field"><span>دسته</span><select id="f-cat">${CATS.map(([k,e,n])=>`<option value="${k}"${(it.cat||'other')===k?' selected':''}>${e} ${n}</option>`).join('')}</select></label>
      <label class="field"><span>نوع</span><select id="f-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}"${ty===k?' selected':''}>${l}</option>`).join('')}</select></label></div>
      <div class="pair" id="f-tgtrow"${ty==='check'?' hidden':''}><label class="field"><span>هدف روزانه</span><input id="f-target" type="number" min="1" inputmode="numeric" value="${esc(it.target||(ty==='steps'?S.settings.stepGoal:ty==='min'?10:8))}"></label>
      <label class="field"><span>واحد</span><input id="f-unit" value="${esc(it.unit||'')}" placeholder="لیوان، دقیقه…"></label></div>
      <label class="field"><span>لینک (اختیاری، مثلاً حبل‌المتین یا فیدیبو)</span><input id="f-link" type="url" inputmode="url" value="${esc(it.link||'')}" placeholder="https://…"></label>
      <label class="field"><span>باز کردن اپ نصب‌شده (اختیاری)</span><input id="f-app" dir="ltr" value="${esc(it.app||'')}" placeholder="com.example.app"><small class="hint">شناسه‌ی اپ را از لینک صفحه‌اش در Play Store بردارید: بخشِ بعد از ‎id=‎</small></label>
      <label class="field"><span>یادآوری روزانه (اختیاری)</span><input id="f-remind" type="time" value="${esc(it.remind||'')}"></label>`;
  }
  if(t==='goal')f+=`<label class="field"><span>بازه</span><select id="f-period">${PERIODS.map(([k,l])=>`<option value="${k}"${(it.period||(ui.tab==='goals'?ui.gp:'week'))===k?' selected':''}>${l}</option>`).join('')}</select></label><label class="field"><span>مهلت (اختیاری)</span><input id="f-date" type="date" value="${esc(it.deadline||'')}"></label>`+(ed?'':`<label class="field"><span>گام‌ها، هر خط یک گام</span><textarea id="f-steps"></textarea></label>`);
  $('#sheet').innerHTML=`<h3>${ed?'ویرایش':'افزودن'}</h3>${seg}${f}<div class="err" id="f-err"></div>
    <div class="actions"><button class="btn" type="submit">ذخیره</button>${ed?'<button class="ghost danger" type="button" data-act="delete">حذف</button>':''}<button class="ghost" type="button" data-act="close">انصراف</button></div>`;
  const ft=$('#f-type');if(ft)ft.addEventListener('change',()=>{$('#f-tgtrow').hidden=ft.value==='check';const u=$('#f-unit'),tg=$('#f-target');
    if(ft.value==='steps'){u.value='قدم';tg.value=S.settings.stepGoal}else if(ft.value==='min'){u.value=u.value||'دقیقه'}});
}
function closeSheet(){$('#scrim').classList.remove('open');ui.editing=null}
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('#f-title').value.trim();if(!title){$('#f-err').textContent='یک عنوان بنویسید.';return}
  const v=id=>{const el=$(id);return el?el.value:''};
  const t=ui.sheetType,it=ui.editing,now=Date.now();
  if(t==='event'){
    if(!v('#f-date')){$('#f-err').textContent='تاریخ را انتخاب کنید.';return}
    if(v('#f-end')&&v('#f-end')<v('#f-start')){$('#f-err').textContent='زمان پایان باید بعد از شروع باشد.';return}
    const data={title,date:v('#f-date'),start:v('#f-start'),end:v('#f-end')};
    if(it)Object.assign(it,data);else S.events.push(Object.assign({id:uid()},data));ui.sel=data.date;
  }
  if(t==='task'){
    const lines=v('#f-subs').split('\n').map(s=>s.trim()).filter(Boolean);
    const old=Object.entries((it&&it.subs)||{}).filter(([,s])=>s&&!s.deleted);
    const subs={};lines.forEach((l,i)=>{const m=old.find(([,s])=>s.title===l);subs[m?m[0]:uid()]=Object.assign({},m?m[1]:{done:false},{title:l,order:i})});
    const data={title,date:v('#f-date')||null,star:$('#f-star').checked,subs};
    if(it)Object.assign(it,data);else S.tasks.push(Object.assign({id:uid(),done:false,doneAt:null,createdAt:now},data));
  }
  if(t==='habit'){
    const ty=v('#f-type'),link=v('#f-link').trim();
    if(link&&!safeUrl(link)){$('#f-err').textContent='این لینک معتبر نیست.';return}
    const app=v('#f-app').trim().replace(/^.*[?&]id=([^&]+).*$/,'$1');
    if(app&&!/^[a-zA-Z][\w]*(\.[a-zA-Z_][\w]*)+$/.test(app)){$('#f-err').textContent='شناسه‌ی اپ باید شبیه com.example.app باشد.';return}
    const data={app,title,cat:v('#f-cat'),type:ty,target:ty==='check'?1:Math.max(1,parseInt(v('#f-target'),10)||1),unit:ty==='check'?'':v('#f-unit').trim(),link,remind:v('#f-remind')};
    if(it)Object.assign(it,data);else S.habits.push(Object.assign({id:uid(),order:S.habits.length,log:{}},data));
  }
  if(t==='goal'){
    const per=v('#f-period')||'long';
    const pkey=per==='long'?null:(ui.tab==='goals'&&ui.gp===per&&ui.gkey?ui.gkey:periodKey(per,todayKey()));
    if(it){const keep=it.period===per?it.pkey:pkey;Object.assign(it,{title,deadline:v('#f-date')||null,period:per,pkey:keep})}
    else{const steps={};v('#f-steps').split('\n').map(s=>s.trim()).filter(Boolean).forEach((s,i)=>steps[uid()]={title:s,done:false,order:now+i});
      S.goals.push({id:uid(),title,deadline:v('#f-date')||null,steps,period:per,pkey});
      if(ui.tab==='goals'){ui.gp=per;ui.gkey=pkey}}
  }
  closeSheet();save();
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------------- actions ---------------- */
function addStep(gid){const inp=document.querySelector(`[data-step-for="${gid}"]`);const val=inp&&inp.value.trim();if(!val)return;
  const g=find('goals',gid);if(!g)return;inp.value='';g.steps=g.steps||{};g.steps[uid()]={title:val,done:false,order:Date.now()};save()}
function quickTask(){const i=$('#qtask');const val=i&&i.value.trim();if(!val)return;i.value='';
  S.tasks.push({id:uid(),title:val,date:null,star:false,done:false,doneAt:null,subs:{},createdAt:Date.now()});save()}
function seed(){
  const have=new Set(S.habits.map(h=>h.title));let n=0;
  SUGGESTED.forEach(s=>{if(have.has(s.title))return;S.habits.push(Object.assign({id:uid(),order:S.habits.length,log:{},link:'',remind:'',unit:''},s));n++});
  S.seeded=true;save();toast(n?`${fa(n)} عادت اضافه شد. برای «قرآن» می‌توانید لینک حبل‌المتین را در ویرایش بگذارید.`:'همه‌ی عادت‌های پیشنهادی از قبل هستند.');
}
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ui.tab=tab.dataset.tab;if(ui.tab==='day'&&!ui.sel)ui.sel=todayKey();try{sessionStorage.setItem('planner-tab',ui.tab)}catch(x){}render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id,k=todayKey();
  switch(a){
    case 'sel':ui.sel=b.dataset.k;render();break;
    case 'today':ui.sel=todayKey();render();break;
    case 'week':ui.sel=dkey(addDays(parseKey(ui.sel),+b.dataset.n));render();break;
    case 'cal':ui.cal=b.dataset.v;try{sessionStorage.setItem('planner-cal',ui.cal)}catch(x){}render();break;
    case 'month':ui.sel=shiftMonth(ui.sel,+b.dataset.n);render();break;
    case 'rmonth':ui.rmonth=shiftMonth(ui.rmonth,+b.dataset.n);ui.archive=null;render();break;
    case 'archive':ui.archive=ui.archive===b.dataset.k?null:b.dataset.k;render();break;
    case 'closeArchive':ui.archive=null;render();break;
    case 'open':openSheet(b.dataset.type);break;
    case 'edit':{const col=b.dataset.col,it=find(col,id);if(it)openSheet(Object.keys(COL_OF).find(x=>COL_OF[x]===col),it);break}
    case 'stype':{ui.sheetType=b.dataset.type;const keep=$('#f-title').value;drawSheet();$('#f-title').value=keep;break}
    case 'close':closeSheet();break;
    case 'delete':{const it=ui.editing,col=COL_OF[ui.sheetType];if(it&&confirm('حذف شود؟')){S[col]=S[col].filter(x=>x.id!==it.id);closeSheet();save()}break}
    case 'sub':{const it=ui.editing;if(!it||!it.subs||!it.subs[id])break;it.subs[id].done=!it.subs[id].done;b.classList.toggle('on');b.closest('li').classList.toggle('done');save();break}
    case 'hcheck':{const h=find('habits',id);if(h)setHabit(h,k,h.log&&h.log[k]?0:true);break}
    case 'hinc':case 'hdec':{const h=find('habits',id);if(!h)break;const cur=hval(h,k),n=+b.dataset.n;setHabit(h,k,Math.max(0,cur+(a==='hinc'?n:-n)));break}
    case 'task':{const t=find('tasks',id);if(!t)break;t.done=!t.done;t.doneAt=t.done?Date.now():null;save();break}
    case 'star':{const t=find('tasks',id);if(t){t.star=!t.star;save()}break}
    case 'step':{const g=find('goals',b.dataset.g);const s=g&&g.steps[id];if(!s)break;s.done=!s.done;s.doneAt=s.done?Date.now():null;save();break}
    case 'delStep':{const g=find('goals',b.dataset.g);if(g&&g.steps[id]){g.steps[id].deleted=true;save()}break}
    case 'addStep':addStep(b.dataset.g);break;
    case 'quickTask':quickTask();break;
    case 'seed':seed();break;
    case 'settings':ui.prevTab=ui.tab;ui.tab='settings';render();window.scrollTo(0,0);break;
    case 'back':ui.tab=ui.prevTab||'today';render();break;
    case 'pal':S.settings.pal=b.dataset.v;applyLook();save();break;
    case 'font':S.settings.font=b.dataset.v;applyLook();save();break;
    case 'stepsConnect':stepsConnect();break;
    case 'stepsSettings':H('openHealthConnectSettings').catch(()=>{});break;
    case 'testNotif':N('schedule',{notifications:[{id:9999,title:'برنامه‌ی من',body:'اعلان‌ها کار می‌کنند ✅',schedule:{at:new Date(Date.now()+5000).toISOString(),allowWhileIdle:true}}]})
      .then(()=>{toast('تا ۵ ثانیه‌ی دیگر یک اعلان می‌آید.');notif.perm=null;notifStatus()}).catch(()=>toast('اجازه‌ی اعلان داده نشده. از تنظیمات گوشی اجازه دهید.'));break;
    case 'launch':NP('AppLauncher','openUrl',{url:b.dataset.pkg}).then(r=>{if(!r||!r.completed)toast('این اپ روی گوشی پیدا نشد. شناسه را بررسی کنید.')}).catch(()=>toast('باز کردن اپ ممکن نشد.'));break;
    case 'focus':if(ui.tab!=='focus'&&ui.tab!=='settings')ui.prevTab=ui.tab;ui.tab='focus';render();window.scrollTo(0,0);break;
    case 'pstart':{const sel=$('#p-target');if(sel)ui.ptarget=sel.value;pomoStart(b.dataset.ph);break}
    case 'ppause':{const r=S.pomoRun;if(r){r.left=pomoLeft();r.paused=true;save();pomoNotify()}break}
    case 'presume':{const r=S.pomoRun;if(r){r.endAt=Date.now()+r.left;r.paused=false;r.ready=false;save();pomoNotify()}break}
    case 'pskip':{const r=S.pomoRun;if(r){r.endAt=Date.now();r.paused=false;if(r.phase==='focus'){r.total=0}pomoFinish();pomoNotify()}break}
    case 'pstop':{const r=S.pomoRun;if(r){if(r.phase==='focus'&&!r.ready)pomoCredit(Math.floor((r.total-pomoLeft())/60000));S.pomoRun=null;save();pomoNotify()}break}
    case 'gp':ui.gp=b.dataset.v;ui.gkey=ui.gp==='long'?null:periodKey(ui.gp,todayKey());render();break;
    case 'gnav':ui.gkey=shiftPeriod(ui.gp,ui.gkey,+b.dataset.n);render();break;
    case 'gnow':ui.gkey=periodKey(ui.gp,todayKey());render();break;
    case 'carry':{goalsIn(ui.gp,b.dataset.from).forEach(g=>{const st=stepsOf(g);if(st.length&&st.every(x=>x.done))return;const steps={};st.filter(x=>!x.done).forEach((x,i)=>steps[uid()]={title:x.title,done:false,order:i});
      S.goals.push({id:uid(),title:g.title,deadline:g.deadline||null,steps,period:ui.gp,pkey:ui.gkey})});save();break}
    case 'export':exportBackup();break;
    case 'exact':N('changeExactNotificationSetting').then(r=>{notif.exact=r&&r.exact_alarm;render();queueReschedule()}).catch(()=>{});break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target,st=S.settings;
  if(t.id==='s-day'){st.dayStart=+t.value;save()}
  else if(t.id==='s-ev'){st.eventRemind=+t.value;save()}
  else if(t.id==='s-grat'){st.gratRemind=t.value;save()}
  else if(t.id==='s-hand'){st.hand=t.checked;applyLook();save()}
  else if(t.id==='s-pf'){S.pomo.focus=+t.value;save()}
  else if(t.id==='s-ps'){S.pomo.short=+t.value;save()}
  else if(t.id==='s-pl'){S.pomo.long=+t.value;save()}
  else if(t.id==='p-target'){ui.ptarget=t.value}
  else if(t.id==='s-import'){if(t.files&&t.files[0])importBackup(t.files[0]);t.value=''}
  else if(t.id==='s-steps'){st.stepGoal=Math.max(1000,parseInt(t.value,10)||8000);save()}
});
let gT=null;
document.addEventListener('input',e=>{
  const i=e.target.dataset&&e.target.dataset.grat;if(i==null)return;
  const k=todayKey();S.grat[k]=S.grat[k]||['','','','',''];S.grat[k][+i]=e.target.value;
  clearTimeout(gT);gT=setTimeout(()=>{lsSet(KEY,JSON.stringify(S));queueReschedule()},400);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
  if(t.id==='qtask'){e.preventDefault();quickTask()}
  else if(t.dataset&&t.dataset.stepFor){e.preventDefault();addStep(t.dataset.stepFor)}
  else if(t.dataset&&t.dataset.grat!=null){e.preventDefault();const n=document.querySelector(`[data-grat="${+t.dataset.grat+1}"]`);if(n)n.focus();else t.blur();scheduleRender()}
});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.grat!=null)setTimeout(()=>{if(!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.grat!=null))scheduleRender()},50)});
$('#fab').addEventListener('click',()=>openSheet());

/* live clock + day rollover */
let lastDay=null;
setInterval(()=>{
  const c=$('#clock');if(c)c.textContent=clockText();
  const k=todayKey();if(k!==lastDay){lastDay=k;if(!$('#scrim').classList.contains('open')&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()}
},15000);

load();normalize();applyLook();lastDay=todayKey();ui.sel=todayKey();ui.rmonth=todayKey();render();queueReschedule();
})();
</script>
</body>
